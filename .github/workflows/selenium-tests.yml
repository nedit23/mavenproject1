name: Selenium TestNG CI/CD Pipeline

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  # JOB 1: Execute Selenium TestNG Automation Tests
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Java and Chrome
        run: |
          java -version
          google-chrome --version

      - name: Run Selenium tests
        run: mvn clean test

  # JOB 2: Build and Publish Docker Image
  build-and-publish-docker:
    needs: selenium-test
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.NAME }}
          password: ${{ secrets.TOKEN }}

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validate Docker username
      - name: Validate Docker Hub username
        env:
          DOCKER_USERNAME: ${{ secrets.NAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "Error: NAME secret is missing!"
            exit 1
          fi
          echo "Docker Hub username configured successfully."

      # Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.NAME }}/selenium-testng-automation:latest
            ${{ secrets.NAME }}/selenium-testng-automation:${{ github.sha }}
